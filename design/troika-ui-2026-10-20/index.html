<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тройка — все макеты</title><style>
@font-face{font-family:Golos;src:url('fonts/GolosText-Variable.ttf');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#242522;font:14px/1.5 Golos,Arial,sans-serif}header{padding:28px 32px 20px;border-bottom:1px solid #ddded9;position:sticky;top:0;background:#f5f5f2ee;backdrop-filter:blur(12px);z-index:2}h1{font-size:24px;font-weight:500;margin:0 0 4px}p{margin:0;color:#676862}a{color:inherit}nav{display:flex;gap:16px;margin:14px 0}nav a{text-underline-offset:4px}label{display:flex;gap:8px;align-items:center}input,select,button{font:inherit;padding:8px 12px;background:white;border:1px solid #ddded9;border-radius:8px;color:inherit}input{min-width:200px}button{cursor:pointer}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}.count{margin-left:auto;color:#676862}main{padding:24px 32px 48px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px 24px}.gallery.desktop{grid-template-columns:repeat(auto-fill,minmax(460px,1fr))}.screen{margin:0;min-width:0}.screen a{display:block;background:#e8e9e4;border:1px solid #ddded9;border-radius:10px;overflow:hidden;box-shadow:0 4px 14px #00000006;text-decoration:none}.screen img{display:block;width:100%;height:520px;object-fit:cover;object-position:top}.desktop .screen img{height:330px}.screen figcaption{margin-top:10px;display:flex;justify-content:space-between;gap:10px}.screen small{color:#676862}.status{margin-bottom:20px;font-size:12px}.empty{padding:60px;color:#676862}a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #955d21;outline-offset:3px}@media(max-width:650px){header,main{padding:20px}.gallery,.gallery.desktop{grid-template-columns:1fr}.controls label{flex:1}.count{margin-left:0}.screen img{height:620px}}
</style></head><body><header><h1>Тройка · макеты Android и ПК</h1><p>20 октября 2026 · направление ChatGPT / Codex · Golos Text</p><nav><a href="prototype.html">Открыть прототип</a><a href="FIGMA.md">Редактирование в Figma</a><a href="README.md">Описание комплекта</a></nav><div class="controls"><label>Платформа <select id="platform"><option value="android">Android</option><option value="desktop">ПК</option></select></label><label>Тема <select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label><label>Раздел <select id="group"><option value="all">Все страницы</option><option value="first">Первые пять</option></select></label><input type="search" id="search" placeholder="Найти страницу" aria-label="Найти страницу"><span class="count" id="count"></span></div></header><main><p class="status">Нажми на макет, чтобы открыть его в полный размер. Данные демонстрационные. Макеты не означают готовую функцию приложения.</p><div class="gallery" id="gallery"></div></main><script src="pages.js"></script><script>
const controls=['platform','theme','group','search'].map(id=>document.getElementById(id));const [platform,theme,group,search]=controls;for(const name of [...new Set(TROIKA_PAGES.map(p=>p.group))])group.add(new Option(name,name));if(new URLSearchParams(location.search).has('first'))group.value='first';function render(){const selected=TROIKA_PAGES.filter(p=>(!p.only||p.only===platform.value)&&(group.value==='all'||group.value==='first'&&p.index<5||p.group===group.value)&&p.name.toLowerCase().includes(search.value.toLowerCase()));document.getElementById('count').textContent=selected.length+' страниц';const gallery=document.getElementById('gallery');gallery.className='gallery '+platform.value;gallery.innerHTML=selected.map(p=>`<figure class="screen"><a href="app.html?platform=${platform.value}&theme=${theme.value}&page=${p.id}" target="_blank"><img loading="lazy" src="previews/${platform.value}/${theme.value}/${p.id}.png" alt="${p.name}"></a><figcaption><span>${p.index+1}. ${p.name}</span><small>${p.group}</small></figcaption></figure>`).join('')||'<div class="empty">Нет подходящих страниц.</div>';}controls.forEach(el=>el.addEventListener('input',render));render();
</script></body></html>
