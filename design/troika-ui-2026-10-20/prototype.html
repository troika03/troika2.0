<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тройка — прототип</title><style>@font-face{font-family:Golos;src:url('fonts/GolosText-Variable.ttf')}*{box-sizing:border-box}body{margin:0;background:#e8e9e4;font:14px/1.5 Golos,Arial,sans-serif;color:#242522}header{padding:14px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#f5f5f2;border-bottom:1px solid #ddded9}a{color:inherit;margin-right:auto}select{font:inherit;padding:8px 12px;border:1px solid #ddded9;border-radius:8px;background:white;color:inherit}.hint{font-size:12px;color:#676862;margin:14px 20px}iframe{display:block;border:0;margin:20px auto 40px;box-shadow:0 10px 40px #00000012;background:#181818;max-width:100%}iframe.android{width:390px;height:844px}iframe.desktop{width:1280px;height:900px}</style></head><body><header><a href="index.html">Все макеты</a><select id="platform" aria-label="Платформа"><option value="android">Android</option><option value="desktop">ПК</option></select><select id="theme" aria-label="Тема"><option value="dark">Тёмная</option><option value="light">Светлая</option></select><select id="page" aria-label="Страница"></select></header><p class="hint">Кликабельный прототип. Переходы и переключатели работают локально; микрофон, вход, платежи и отправка сообщений не подключены.</p><iframe id="frame" title="Прототип Тройки"></iframe><script src="pages.js"></script><script>const p=document.getElementById('platform'),t=document.getElementById('theme'),s=document.getElementById('page'),f=document.getElementById('frame');for(const item of TROIKA_PAGES)s.add(new Option(item.name,item.id));function refresh(){f.className=p.value;f.src=`app.html?platform=${p.value}&theme=${t.value}&page=${s.value}`;}[p,t,s].forEach(el=>el.addEventListener('input',refresh));refresh();</script></body></html>
