<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>body{font:13px/1.5 Arial,sans-serif;color:#1f2923;margin:20px;background:#fafcf9}h2{font-size:18px;margin:0 0 8px}p{color:#68756b}label{display:block;margin:14px 0 5px}input,select,button{font:inherit;width:100%;box-sizing:border-box;padding:9px;border:1px solid #dde5db;background:#fff;border-radius:8px;color:#1f2923}button{margin-top:20px;background:#1f2923;color:#fff;cursor:pointer}button:disabled{opacity:.5}progress{width:100%;margin-top:18px}pre{white-space:pre-wrap;font:12px/1.5 Arial,sans-serif}small{color:#68756b}</style></head><body><h2>Тройка · все слои редактируются</h2><p>Выбери scenes.json из этой папки. Сначала можно импортировать первые пять страниц.</p><label>Файл макетов<input id="file" type="file" accept=".json"></label><label>Страницы<select id="scope"><option value="first">Первые пять</option><option value="all">Все страницы</option></select></label><label>Платформа<select id="platform"><option value="all">Android и ПК</option><option value="android">Android</option><option value="desktop">ПК</option></select></label><label>Тема<select id="theme"><option value="all">Обе темы</option><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label><button id="import" disabled>Импортировать</button><progress id="progress" value="0" max="1"></progress><pre id="status">Загрузи scenes.json.</pre><small>Текст, векторы, рамки и цвета остаются отдельными слоями. Повторный импорт пропускает существующие макеты и сохраняет твои правки.</small><script>
let scenes=[];const $=id=>document.getElementById(id);$('file').onchange=async()=>{try{scenes=JSON.parse(await $('file').files[0].text());if(!Array.isArray(scenes)||!scenes.every(s=>s.root&&s.id&&s.platform&&s.theme))throw Error('Не подходит структура файла');$('import').disabled=false;$('status').textContent=`Загружено ${scenes.length} макетов.`;}catch(e){$('status').textContent=e.message;$('import').disabled=true;}};$('import').onclick=()=>{const selected=scenes.filter(s=>($('scope').value!=='first'||s.index<5)&&($('platform').value==='all'||s.platform===$('platform').value)&&($('theme').value==='all'||s.theme===$('theme').value));$('import').disabled=true;$('status').textContent='Создаю основу и загружаю шрифты…';parent.postMessage({pluginMessage:{type:'import',scenes:selected}},'*');};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='progress'){$('progress').max=m.total||1;$('progress').value=m.done;$('status').textContent=m.text;}if(m.type==='done'||m.type==='error'){$('status').textContent=m.text;$('import').disabled=false;}};
</script></body></html>
