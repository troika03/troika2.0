  - {id: sequential-thinking, title: Sequential Thinking, description: "Пошаговое рассуждение.", category: Локальные, auth: local, homepage: "https://github.com/modelcontextprotocol/servers"}
  - {id: playwright, title: Playwright, description: "Управление браузером.", category: Локальные, auth: local, homepage: "https://github.com/microsoft/playwright-mcp"}
  - {id: blender, title: Blender, description: "Сцены Blender на компьютере.", category: Локальные, auth: local}
