model:
  # Pin a conversational agent: the random free router can select classifiers.
  default: nvidia/nemotron-3-ultra-550b-a55b:free
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

# A failed free request must not activate a paid provider or legacy fallback.
fallback_providers: []
fallback_model: null

auxiliary:
  development:
    use_free_company_models: true
  development_review:
    use_free_company_models: true
  development_free:
    provider: openrouter
    model: openrouter/free
    base_url: ""
    api_key: ${OPENROUTER_API_KEY}

toolsets:
  - troika-product

platform_toolsets:
  api_server:
    - troika-product

platforms:
  api_server:
    enabled: true
    extra:
      product_voice_enabled: true
      product_resource_prices:
        openrouter/free:
          provider: openrouter
          version: free-development-2026-11-24
          debit_mode: model_tokens
          input_rub: 0
          output_rub: 0
          cache_read_rub: 0
          cache_write_rub: 0
          default_output_tokens: 8192
          maximum_output_tokens: 65536
        nvidia/nemotron-3-ultra-550b-a55b:free:
          provider: openrouter
          version: free-agent-2026-11-23
          debit_mode: model_tokens
          input_rub: 0
          output_rub: 0
          cache_read_rub: 0
          cache_write_rub: 0
          default_output_tokens: 8192
          maximum_output_tokens: 65536
        nvidia/nemotron-3.5-lightning:free:
          provider: openrouter
          version: free-agent-2026-10-29
          debit_mode: model_tokens
          input_rub: 0
          output_rub: 0
          cache_read_rub: 0
          cache_write_rub: 0
          default_output_tokens: 8192
          maximum_output_tokens: 65536
      product_speech:
        backend: openrouter
        voice: ""
      product_resource_services:
        "openrouter:fish-audio/s2.1-pro-free:free":
          version: fish-openrouter-free-20261016
          unit: characters
          rub_per_unit: "0"
          maximum_units: 5000
      product_screen_snapshot_enabled: false
      product_screen_external_vision_enabled: false
      product_retention_enabled: true
      product_retention_dry_run: false
      product_retention_interval_seconds: 21600
      product_stt_url: http://stt:8766

agent:
  max_turns: 90
  tool_use_enforcement: true
  api_max_retries: 3
  reasoning_effort: none

stt:
  enabled: true
  provider: groq

openrouter:
  response_cache: true
  response_cache_ttl: 300

web:
  backend: searxng
  search_backend: searxng

logging:
  level: WARNING

plugins:
  disabled:
    - web/brave_free
    - web/ddgs
    - web/exa
    - web/firecrawl
    - web/parallel
    - web/tavily
    - web/xai
