<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Тройка — Когда твой ИИ уже охренел</title>
<link rel="stylesheet" href="devices.css">
<style>
@font-face { font-family:Golos; src:url("../../brand/troika/fonts/GolosText-Variable.ttf") format("truetype"); font-weight:400 900; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#0b0c10; }
#root {
  width:540px; height:960px; position:absolute; left:50%; top:50%; overflow:hidden; isolation:isolate;
  transform:translate(-50%,-50%) scale(var(--fit,1)); background:#0b0c10; color:#f4f5f7; font-family:Golos,sans-serif;
}
#room {
  position:absolute; inset:-80px; background:
  radial-gradient(ellipse at 72% 30%,#285747 0%,#172b25 27%,transparent 58%),
  radial-gradient(ellipse at 16% 59%,#162420 0%,transparent 58%),#0b0c10;
}
#grid {
  position:absolute; width:760px; height:580px; left:-110px; top:410px; transform:perspective(440px) rotateX(63deg);
  background-image:linear-gradient(#86c4ad17 1px,transparent 1px),linear-gradient(90deg,#86c4ad17 1px,transparent 1px);
  background-size:52px 52px; mask-image:radial-gradient(ellipse,#000a,transparent 70%); opacity:.48;
}
#plinth {
  position:absolute; top:605px; left:22px; right:22px; height:105px;
  background:radial-gradient(ellipse,#8cf0c428,transparent 68%); filter:blur(12px); pointer-events:none;
}
#floor-glint {
  position:absolute; height:1px; top:656px; width:430px; left:55px;
  background:linear-gradient(90deg,transparent,#8cf0c434,transparent); opacity:.62;
}
#aperture { position:absolute; inset:0; perspective:1200px; perspective-origin:50% 43%; }
#camera, #float, #device-rig { position:absolute; inset:0; transform-style:preserve-3d; }
#title { position:absolute; top:95px; left:45px; right:30px; z-index:3; transform-origin:0 0; }
#title h1 { margin:0; font-size:56px; line-height:.99; font-weight:750; letter-spacing:-3.6px; }
#title h1 span { display:block; color:#8cf0c4; }
#title img { display:block; width:25px; margin:0 0 17px; }
.scene-name { position:absolute; z-index:2; top:98px; left:46px; margin:0; color:#dcf5e9; font-size:53px; line-height:1; letter-spacing:-3px; font-weight:720; opacity:0; }
#phone-title { top:87px; }
#consent-approve { position:relative; }
.approval-ripple { position:absolute; width:21px; height:21px; right:6px; top:calc(50% - 10.5px); border:1.6px solid #d6ffeb; border-radius:50%; box-shadow:0 0 9px #8cf0c475; opacity:0; pointer-events:none; }
#sweep { position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0; mix-blend-mode:screen; background:radial-gradient(ellipse at 45% 54%,#94f5c967,transparent 62%); }
#vignette {
  position:absolute; inset:0; z-index:5; pointer-events:none;
  background:linear-gradient(0deg,#090c10 0%,#090c10f1 9%,#090c10b0 18%,transparent 37%);
}
#subtitles { position:absolute; z-index:6; bottom:110px; left:46px; right:55px; min-height:119px; }
.cue { position:absolute; left:0; right:0; top:0; opacity:0; }
.cue-role { font-size:12px; font-weight:720; letter-spacing:.21em; color:#a6adb8; margin:0 0 6px; display:flex; align-items:center; gap:7px; }
.cue-role::before { content:""; display:block; height:1px; width:14px; background:currentColor; }
.cue-troika .cue-role { color:#8cf0c4; }
.cue-text { margin:0; font-weight:680; font-size:32px; letter-spacing:-1.16px; line-height:1.13; text-wrap:pretty; text-shadow:0 1px 16px #000; }
.cue-troika .cue-text { color:#d8f9e8; }
.cue-hit .cue-text { font-size:39px; line-height:1.08; letter-spacing:-1.7px; }
#meter { position:absolute; z-index:0; left:39px; right:39px; top:410px; height:204px; display:flex;
  justify-content:space-between; align-items:center; opacity:0; }
#meter i { width:3px; height:112px; background:linear-gradient(transparent,#8cf0c4b8,transparent); border-radius:5px; }
#outro { position:absolute; z-index:7; inset:0; pointer-events:none; display:grid; align-content:center; justify-items:center; opacity:0; text-align:center; }
#outro .outro-mark { width:94px; height:94px; filter:drop-shadow(0 0 32px #3ddc973d); }
#outro h2 { margin:14px 0 19px; font-size:67px; font-weight:780; letter-spacing:-3.8px; line-height:1; }
#outro p { max-width:420px; margin:0; line-height:1.19; font-size:25px; font-weight:570; letter-spacing:-.55px; text-wrap:balance; }
#outro p span { color:#8cf0c4; }
#outro .channel { margin-top:36px; font-weight:550; color:#cdd8d2; font-size:22px; letter-spacing:-.18px; }
</style>
<main id="root">
  <div id="room"></div><div id="grid"></div><div id="meter"></div>
  <div id="plinth"></div><div id="floor-glint"></div>
  <div id="aperture"><div id="camera"><div id="float"><div id="device-rig"></div></div></div></div>
  <div id="title"><img src="../../brand/troika/logos/mark-amber.svg" alt=""><h1>Когда твой ИИ<span>уже охренел</span></h1></div>
  <h2 class="scene-name" id="computer-title">Компьютер</h2>
  <h2 class="scene-name" id="phone-title">Телефон</h2>
  <div id="sweep"></div><div id="vignette"></div>
  <div id="subtitles"></div>
  <div id="outro">
    <img class="outro-mark" src="../../brand/troika/logos/mark-white.svg" alt="">
    <h2>TROIKA</h2>
    <p>Управляй устройствами голосом.<br><span>Если выдержишь характер.</span></p>
    <p class="channel">Telegram: @troika_assistantlab</p>
  </div>
</main>
<script src="local/gsap.min.js"></script>
<script src="local/cues.js"></script>
<script src="devices.js"></script>
<script src="motion.js"></script>
