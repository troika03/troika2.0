const clamp = (x, low = 0, high = 1) => Math.max(low, Math.min(high, x));
const mix = (a, b, t) => a + (b - a) * t;
const linear = t => t;
const smooth = t => t*t*(3-2*t);
const cubicIn = t => t*t*t;
const expo = t => (1 - Math.exp(-4.5*t)) / (1 - Math.exp(-4.5));
const settle = t => 1 - (1-t)**2.35;
function kf(frame, points, ease = linear) {
  if (frame <= points[0][0]) return points[0][1];
  for (let i=1; i<points.length; i++) {
    const [left, a] = points[i-1];
    const [right, b, curve = ease] = points[i];
    if (frame <= right) return mix(a, b, curve((frame-left)/(right-left)));
  }
  return points.at(-1)[1];
}
const speed = (curve, f) => Math.abs(curve(f + .04) - curve(f - .04)) / .08;

const n = value => Number(value.toFixed(4));
const esc = value => String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const paint = id => "url(#"+id+")";
const g = (body, attrs = "") => '<g '+attrs+'>'+body+'</g>';
const pos = (x,y,body) => g(body,'transform="translate('+n(x)+' '+n(y)+')"');
const at = (x,y,s,body) => g(body,'transform="translate('+n(x)+' '+n(y)+') scale('+n(s)+')"');
const rotate = (angle,x,y,body) => g(body,'transform="rotate('+n(angle)+' '+x+' '+y+')"');
const alpha = (opacity,body) => opacity >= 1 ? body : g(body,'opacity="'+n(clamp(opacity))+'"');
const filter = (id,body) => g(body,'filter="'+paint(id)+'"');
const clip = (id,body) => g(body,'clip-path="'+paint(id)+'"');
const rect = (x,y,w,h,r,fill,attrs="") => '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" rx="'+n(r)+'" fill="'+fill+'" '+attrs+'/>';
const circ = (x,y,r,fill,attrs="") => '<circle cx="'+n(x)+'" cy="'+n(y)+'" r="'+n(r)+'" fill="'+fill+'" '+attrs+'/>';
const ellipse = (x,y,rx,ry,fill,attrs="") => '<ellipse cx="'+n(x)+'" cy="'+n(y)+'" rx="'+n(rx)+'" ry="'+n(ry)+'" fill="'+fill+'" '+attrs+'/>';
const path = (d,fill="none",attrs="") => '<path d="'+d+'" fill="'+fill+'" '+attrs+'/>';
const t = (x,y,value,size,weight,fill,attrs="") => '<text x="'+n(x)+'" y="'+n(y)+'" font-size="'+n(size)+'" font-weight="'+weight+'" fill="'+fill+'" '+attrs+'>'+esc(value)+'</text>';
const use = (id,attr="") => '<use href="#'+id+'" '+attr+'/>';
const rim = (color="#fff", opacity=.55, width=1) => 'stroke="'+color+'" stroke-opacity="'+opacity+'" stroke-width="'+width+'"';

function stops(values) {
  return values.map(([offset,color,opacity=1]) => '<stop offset="'+offset+'" stop-color="'+color+'" stop-opacity="'+opacity+'"/>').join("");
}
function linearGradient(id, values, x1=0, y1=0, x2=1, y2=1) {
  return '<linearGradient id="'+id+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'">'+stops(values)+'</linearGradient>';
}
function radial(id,values,cx=.5,cy=.5) {
  return '<radialGradient id="'+id+'" cx="'+cx+'" cy="'+cy+'">'+stops(values)+'</radialGradient>';
}
function gaussian(id,x,y=x,bounds=40) {

  return at(x,y,size/24,path(paths[name],"none",'stroke="'+color+'" stroke-width="'+weight+'" stroke-linejoin="round" stroke-linecap="round"'));

function windows(x,y,s,color="#80caff") {
  const grid = [[0,0],[10.7,0],[0,10.7],[10.7,10.7]];
  return at(x,y,s/20,grid.map(([a,b])=>rect(a,b,9.3,9.3,.6,color)).join(""));
}
function bars(x,y,widths,height,gap,color,opacity=.25) {

}
function lightPath(d, opacity=1, width=1.8) {

}
function pointer(x,y,scale,angle) {

}
function studio(f=28) {

  return rect(0,0,W,H,0,paper)+

    ellipse(965,1090,1110,518,paint("studio-blue"))+
    ellipse(1580,480,630,646,paint("studio-ice"));
}
function neutral() {
  return rect(0,0,W,H,0,paper)+alpha(.31,ellipse(951,941,900,289,paint("studio-ice")));
}

function blur(id, x,y,body) {
  if (x<.03 && y<.03) return body;
  return def(gaussian(id,x,y,90))+filter(id,body);
}
function scaledAround(x,y,s,body) { return at(x,y,s,pos(-x,-y,body)); }

function core(f) {
  const radius = kf(f,[[0,425],[3,349],[14,216,settle],[16,216],[28.5,286,cubicIn]]);
  const orbit = kf(f,[[0,1.08],[14,0,settle],[16,-.015],[29,-.13,cubicIn]]);
  const row = kf(f,[[16,0],[29,1,cubicIn]]);
  const size = kf(f,[[0,276],[14,178,expo],[16,182],[29,40,cubicIn]]);
  const tileSize = kf(f,[[0,88],[3,94],[14,92],[29,47,smooth]]);
  const halo = kf(f,[[0,202],[3,240],[14,326,settle],[16,330],[29,89,cubicIn]]);
  const tiles = [
    [Math.PI,"white",0],[Math.PI*1.5,"blue",-154],
    [0,"cyan",-75],[Math.PI*.5,"mint",72]
  ];
  const tileArt = ([angle,color,rowX]) => {
    const x = 960+mix(Math.cos(angle+orbit)*radius,rowX,row);
    const y = 540+(Math.sin(angle+orbit)*radius)*(1-row);
    const width = tileSize*(1+row*.48);
    return pos(x,y,filter("tile-shadow",rect(-width/2,-tileSize/2,width,tileSize,tileSize*.283,
      paint(color+"-tile"),rim(color==="white"?"#a8b9ca":"#ebfbff",color==="white"?.67:.51,1.15)))+
      rect(-width/2+2,-tileSize/2+2,width-4,tileSize-4,tileSize*.266,"none",rim("#fff",.46,1)));
  };
  const icon = pos(960,540,filter("object-shadow",rect(-size/2,-size/2,size,size,size*.28,

function seek(tick) {
  const frame = clamp(Number(tick)||0,0,END-1e-6);
  const shot = shots.find(s=>frame>=s.f0 && frame<s.f1);
  scene.innerHTML = shot.render(frame-shot.f0);
  document.documentElement.dataset.frame = String(frame);
  document.documentElement.dataset.shot = String(shots.indexOf(shot)+1);
}
window.seek = seek;
window.timelineReady = Promise.all([400,500,600,700].map(w=>document.fonts.load(w+" 40px Inter","Тройка Действия Память")))
  .then(()=>document.fonts.ready)
  .then(()=>{
    metrics.headerWord = measure("Тройка",81,500,-3.5);
    metrics.headerWidth = 167+metrics.headerWord+27+218;
    metrics.headerScale = Math.min(1,815/metrics.headerWidth);
    metrics.promptSize = fit(command,38,520,669,-.3);
    metrics.featureSizes = Object.fromEntries(["Действия","Память"].map(title=>[title,fit(title,111,710,498,-.9)]));
    metrics.wordmarkAt100 = measure("ТРОЙКА",100,600,1.4);
    measureContext.font = "600 100px Inter";
    const box = measureContext.measureText("ТРОЙКА");
    metrics.wordmarkBaseline = (box.actualBoundingBoxAscent-box.actualBoundingBoxDescent)/2;
    seek(40);
  });

</script>
