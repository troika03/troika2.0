name: troika_assistant
description: "Тройка — персональный голосовой ассистент"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_svg: '>=2.3.0 <3.0.0'

  # ── State management ──────────────────────────────────────────
  provider: ^6.1.2

  # ── HTTP клиент для Troika API ─────────────────────────────────
  http: ^1.2.0

  # ── Запись звука (микрофон) ────────────────────────────────────
  record: ^6.1.1

  # ── TTS — встроенный Android TTS (офлайн, бесплатно) ──────────
  flutter_tts: ^4.0.2

  # ── Хранение настроек ─────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Разрешения (микрофон) ─────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Воспроизведение аудио ─────────────────────────────────────
  audioplayers: ^6.0.0
  just_audio: '>=0.10.6 <0.12.0'

  # ── Временные файлы ───────────────────────────────────────────
  path_provider: ^2.1.3

  # ── Выбор фото из галереи / камеры (отправка в чат) ───────────
  image_picker: ^1.1.2

  # ── Выбор файлов/документов ───────────────────────────────────
  file_picker: ^8.1.2

  # ── Открытие ссылок (кликабельные URL в сообщениях) ───────────
  url_launcher: ^6.3.0
  google_mlkit_translation: ^0.13.1
  open_filex: ^4.7.0
  archive: '>=4.3.0 <5.0.0'
  crypto: '>=3.0.6 <4.0.0'

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Variable.ttf
          weight: 400
        - asset: assets/fonts/GolosText-Variable.ttf
          weight: 500
