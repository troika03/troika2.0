plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.troika.hermes_assistant"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.troika.hermes_assistant"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            // 20.06: R8/minify отключён — крэшил JVM по OOM на машине с 16G RAM.
            // Для личного APK обфускация не нужна; APK чуть больше, но собирается.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Provisioned from the pinned, hash-verified wake dependency lock before building.
    implementation files('wake-dependencies/vosk-android-0.3.75.aar')
    implementation files('wake-dependencies/jna-5.18.1.aar')
    testImplementation 'junit:junit:4.13.2'
    // Same version already used by just_audio; native background speech streams from RAM.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // WebSocket-клиент для связи с Hermes PC
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // FileProvider для безопасной передачи URI камере
    implementation 'androidx.core:core-ktx:1.13.1'
}

tasks.register('verifyOfflineWakeAssets') {
    doLast {
        def required = [
            'wake-dependencies/vosk-android-0.3.75.aar',
            'wake-dependencies/jna-5.18.1.aar',
            'src/main/assets/model-wake-ru/manifest.json',
            'src/main/assets/model-wake-ru/am/final.mdl',
            'src/main/assets/model-wake-ru/conf/model.conf',
            'src/main/assets/model-wake-ru/graph/Gr.fst'
        ]
        if (required.any { !file(it).isFile() }) {
            throw new GradleException('Offline wake assets are missing. Run the pinned wake provisioning script before building.')
        }
        def lock = new groovy.json.JsonSlurper().parse(file('../../tool/offline-wake.lock.json'))
        def digest = { asset ->
            def checksum = java.security.MessageDigest.getInstance('SHA-256')
            asset.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = input.read(buffer)) != -1) checksum.update(buffer, 0, count)
            }
            checksum.digest().encodeHex().toString()
        }
        lock.libraries.each { library ->
            def asset = file('wake-dependencies/' + library.filename)
            if (asset.length() != library.size || digest(asset) != library.sha256) {
                throw new GradleException('Offline wake library differs from its lock: ' + library.filename)
            }
        }
        [[directory: 'model-wake-ru', model: lock.model],
         [directory: 'model-owner-voice', model: lock.speaker_model]].each { item ->
            def modelRoot = file('src/main/assets/' + item.directory)
            def manifestFile = new File(modelRoot, 'manifest.json')
            if (!manifestFile.isFile() || digest(manifestFile) != item.model.manifest_sha256) {
                throw new GradleException('Offline voice model manifest differs from its lock: ' + item.directory)
            }
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            manifest.files.each { entry ->
                def asset = new File(modelRoot, entry.path)
                if (!asset.isFile() || asset.length() != entry.size || digest(asset) != entry.sha256) {
                    throw new GradleException('Offline voice model file differs from its lock: ' + entry.path)
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyOfflineWakeAssets') }
