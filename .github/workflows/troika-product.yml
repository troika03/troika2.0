name: Troika product

on:
  push:
    branches: [main]
    paths:
      - "troika_product/**"
      - "gateway/run.py"
      - "gateway/session.py"
      - "gateway/platforms/api_server.py"
      - "gateway/platforms/base.py"
      - "gateway/platforms/phone_bridge.py"
      - "gateway/session_context.py"
      - "tools/approval.py"
      - "tools/registry.py"
      - "tools/troika_*.py"
      - "tools/location_tool.py"
      - "model_tools.py"
      - "run_agent.py"
      - "toolsets.py"
      - "tests/troika_product/**"
      - "tests/gateway/test_product_*.py"
      - "tests/gateway/test_vision_memory_leak.py"
      - "tests/tools/test_product_action_approval.py"
      - "tests/tools/test_troika_*.py"
      - "tests/agent/test_troika_product_persona.py"
      - "tests/integration/test_voice_channel_flow.py"
      - "hermes-android/**"
      - "web/**"
      - "scripts/run_tests.sh"
      - "scripts/run_tests_parallel.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/troika-product.yml"
  pull_request:
    branches: [main]
    paths:
      - "troika_product/**"
      - "gateway/run.py"
      - "gateway/session.py"
      - "gateway/platforms/api_server.py"
      - "gateway/platforms/base.py"
      - "gateway/platforms/phone_bridge.py"
      - "gateway/session_context.py"
      - "tools/approval.py"
      - "tools/registry.py"
      - "tools/troika_*.py"
      - "tools/location_tool.py"
      - "model_tools.py"
      - "run_agent.py"
      - "toolsets.py"
      - "tests/troika_product/**"
      - "tests/gateway/test_product_*.py"
      - "tests/gateway/test_vision_memory_leak.py"
      - "tests/tools/test_product_action_approval.py"
      - "tests/tools/test_troika_*.py"
      - "tests/agent/test_troika_product_persona.py"
      - "tests/integration/test_voice_channel_flow.py"
      - "hermes-android/**"
      - "web/**"
      - "scripts/run_tests.sh"
      - "scripts/run_tests_parallel.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/troika-product.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: troika-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-product-security:
    name: Python product/security slice
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.11.15"

      - name: Set up Python 3.11.13
        run: uv python install 3.11.13

      - name: Install locked project dependencies
        run: |
          uv venv .venv --python 3.11.13
          uv sync --locked --extra all

      - name: Run Troika product and security tests
        run: |
          scripts/run_tests.sh -j 4 \
            tests/troika_product \
            tests/gateway/test_product_auth.py \
            tests/gateway/test_product_phone_bridge.py \
            tests/gateway/test_product_assistant.py \
            tests/gateway/test_product_notification_preferences.py \
            tests/gateway/test_vision_memory_leak.py \
            tests/tools/test_product_action_approval.py \
            tests/tools/test_troika_assistant_tool.py \
            tests/tools/test_troika_documents_tool.py \
            tests/tools/test_troika_screen_tool.py \
            tests/agent/test_troika_product_persona.py \
            tests/integration/test_voice_channel_flow.py \
            -- --tb=short

  android-flutter:
    name: Android Flutter test/analyze/build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hermes-android

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a  # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Resolve dependencies from lockfile
        run: flutter pub get --enforce-lockfile

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze Flutter client
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

  web-dashboard:
    name: Web dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Build dashboard
        run: npm run build
